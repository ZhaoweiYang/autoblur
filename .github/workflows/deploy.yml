name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/video-plate-face-mosaic-9swagr
      - main
  workflow_dispatch:

# Allow the workflow token to enable Pages and publish a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement:true turns on Pages (source = GitHub Actions) on first run.
      # No job-level `environment:` binding here: on a brand-new repo that gate
      # is evaluated before this step runs and rejects the job before Pages is
      # enabled. deploy-pages still publishes to the github-pages environment.
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='_site' \
            --exclude='.github' \
            --exclude='node_modules' \
            ./ _site/
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
